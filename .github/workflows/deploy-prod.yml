name: deploy-prod

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # required-reviewer approval gate on the prod environment
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: deploy to homelab (live scraping on cron)
        env:
          SSH_KEY: ${{ secrets.BIDWATCH_DEPLOY_KEY }}
          SSH_USER: ${{ secrets.BIDWATCH_DEPLOY_USER }}
          SSH_HOST: ${{ secrets.BIDWATCH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_bidwatch
          chmod 600 ~/.ssh/id_bidwatch
          ssh -i ~/.ssh/id_bidwatch -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "cd /opt/bidwatch && git pull --ff-only && docker compose --profile prod up -d --build"
