name: deploy-dev

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: deploy to homelab (fixture mode)
        env:
          SSH_KEY: ${{ secrets.BIDWATCH_DEPLOY_KEY }}
          SSH_USER: ${{ secrets.BIDWATCH_DEPLOY_USER }}
          SSH_HOST: ${{ secrets.BIDWATCH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_bidwatch
          chmod 600 ~/.ssh/id_bidwatch
          ssh -i ~/.ssh/id_bidwatch -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "cd /opt/bidwatch && git pull --ff-only && docker compose --profile dev up --build -d && docker compose --profile dev run --rm worker-dev"
