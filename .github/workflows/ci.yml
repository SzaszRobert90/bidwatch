name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: start minio
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=bidwatchlocal -e MINIO_ROOT_PASSWORD=bidwatchlocal-secret \
            minio/minio:latest server /data
          docker run --rm --network container:minio minio/mc:latest \
            sh -c "until mc alias set l http://localhost:9000 bidwatchlocal bidwatchlocal-secret >/dev/null 2>&1; do sleep 1; done; \
                   mc mb -p l/bidwatch-raw l/bidwatch-curated l/bidwatch-reports"
      - name: start elasticmq
        run: |
          docker run -d --name sqs -p 9324:9324 \
            -v "$PWD/infra/elasticmq.conf:/opt/elasticmq.conf:ro" \
            softwaremill/elasticmq-native:latest
          for i in $(seq 1 30); do
            curl -sf http://localhost:9324/health && break || sleep 1
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: integration tests
        env:
          BIDWATCH_IT: "1"
          BIDWATCH_S3_ENDPOINT: http://localhost:9000
          BIDWATCH_SQS_ENDPOINT: http://localhost:9324
          AWS_ACCESS_KEY_ID: bidwatchlocal
          AWS_SECRET_ACCESS_KEY: bidwatchlocal-secret
        run: npm run test:integration

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile -t bidwatch-worker:ci .
