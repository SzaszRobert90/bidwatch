name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: bidwatchlocal
          MINIO_ROOT_PASSWORD: bidwatchlocal-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-retries 12
      elasticmq:
        image: softwaremill/elasticmq-native:latest
        ports: ["9324:9324"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: create buckets
        run: |
          docker run --rm --network ${{ job.services.minio.network }} minio/mc:latest \
            sh -c "mc alias set l http://minio:9000 bidwatchlocal bidwatchlocal-secret && \
                   mc mb --ignore-existing l/bidwatch-raw l/bidwatch-curated l/bidwatch-reports" || true
      - run: npm ci
      - name: integration tests
        env:
          BIDWATCH_IT: "1"
          BIDWATCH_S3_ENDPOINT: http://localhost:9000
          BIDWATCH_SQS_ENDPOINT: http://localhost:9324
          AWS_ACCESS_KEY_ID: bidwatchlocal
          AWS_SECRET_ACCESS_KEY: bidwatchlocal-secret
        run: npm run test:integration

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile -t bidwatch-worker:ci .
