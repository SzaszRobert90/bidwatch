# ElasticMQ 1.7: SQS-compatible queue for the homelab stack.
node-address = {
  protocol = "http"
  host = "elasticmq"
  port = 9324
}

rest-sqs = {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = "strict"
}

queues {
  bidwatch-main {
    default-visibility-timeout = 300 seconds
    dead-letter-queue {
      max-receive-count = 3
      arn = "arn:aws:sqs:elasticmq:000000000000:bidwatch-dlq"
    }
  }
  bidwatch-dlq {}
}
